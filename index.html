<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Baustellenzeit">
<link rel="manifest" href="manifest.json">
<title>Baustellenzeit</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:650px;margin:auto;min-height:100vh;padding-bottom:90px}
header{background:#111827;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px}
h1{margin:0;font-size:25px}header p{margin:5px 0 0;opacity:.7}main{padding:15px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px #0001}
label{display:block;font-size:13px;font-weight:700;color:#6b7280;margin:11px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #d1d5db;border-radius:11px;background:#fff;color:#111827}
textarea{min-height:75px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-size:16px;font-weight:700;border:0;border-radius:12px;padding:13px 15px}
.primary{background:#111827;color:#fff;width:100%}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row .grow{flex:1}
.stat{background:#f9fafb;border-radius:13px;padding:13px}.big{font-size:32px;font-weight:800;margin-top:3px}
.muted{color:#6b7280;font-size:14px}.item{padding:11px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}
.totalgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:7px 10px calc(7px + env(safe-area-inset-bottom));display:flex;gap:7px;z-index:10}
nav button{flex:1;background:#f3f4f6;padding:9px 4px;font-size:14px}nav button.active{background:#111827;color:#fff}
</style>
</head>
<body>
<div class="app">
<header><h1>Baustellenzeit</h1><p>Stunden · Material · Werkzeug</p></header>
<main>
<section id="home">
<div class="card"><label>Baustelle</label><div class="row"><select id="projectSelect" class="grow"></select><button class="secondary" id="addProjectBtn">＋</button></div></div>
<div class="card"><div class="muted">Gesamtstunden</div><div class="big" id="totalHours">0:00 h</div><div class="muted" id="entryCount">0 Tage</div></div>
<button class="primary" id="newEntryBtn">＋ Arbeitstag erfassen</button>
<div class="card" style="margin-top:14px"><b>Letzte Einträge</b><div id="recent"></div></div>
</section>

<section id="entry" class="hidden">
<div class="card">
<h2 style="margin-top:0">Arbeitstag</h2>
<label>Datum</label><input id="date" type="date">
<div class="grid"><div><label>Beginn</label><input id="start" type="time" value="07:00"></div><div><label>Ende</label><input id="end" type="time" value="15:00"></div></div>
<label>Pause</label><input id="breakTime" type="time" value="01:00">
<div class="stat" style="margin-top:12px"><span class="muted">Arbeitszeit</span><div id="calc" style="font-size:23px;font-weight:800">7:00 h</div></div>
<label>Notiz</label><textarea id="note" placeholder="z. B. Mauer abgebrochen"></textarea>
</div>
<div class="card"><h3 style="margin-top:0">Material</h3><div id="materials"></div><button class="secondary" id="addMaterialBtn">＋ Material</button></div>
<div class="card"><h3 style="margin-top:0">Werkzeug</h3><div id="tools"></div><button class="secondary" id="addToolBtn">＋ Werkzeug</button></div>
<button class="primary" id="saveEntryBtn">Arbeitstag speichern</button>
</section>

<section id="overview" class="hidden">
<div class="card"><h2 style="margin-top:0">Übersicht</h2><label>Baustelle</label><select id="overviewProject"></select>
<div class="totalgrid" style="margin-top:12px"><div class="stat"><span class="muted">Arbeitszeit</span><div id="ovHours" style="font-size:23px;font-weight:800">0:00 h</div></div><div class="stat"><span class="muted">Arbeitstage</span><div id="ovDays" style="font-size:23px;font-weight:800">0</div></div></div></div>
<div class="card"><h3 style="margin-top:0">Tage</h3><div id="days"></div></div>
<div class="card"><h3 style="margin-top:0">Material gesamt</h3><div id="materialSummary"></div></div>
<div class="card"><h3 style="margin-top:0">Werkzeug</h3><div id="toolSummary"></div></div>
</section>

<section id="settings" class="hidden">
<div class="card"><h2 style="margin-top:0">Stammdaten</h2><p class="muted">Diese Einträge werden beim Tippen vorgeschlagen.</p>
<label>Material (mit Komma trennen)</label><input id="materialMaster">
<label>Werkzeug (mit Komma trennen)</label><input id="toolMaster">
<button class="primary" style="margin-top:14px" id="saveMasterBtn">Speichern</button></div>
</section>
</main>
<nav>
<button id="navHome">🏠<br>Start</button><button id="navEntry">＋<br>Eintrag</button><button id="navOverview">📊<br>Übersicht</button><button id="navSettings">⚙️<br>Mehr</button>
</nav>
</div>
<script>
(function(){
"use strict";
var KEY="baustellenzeit_v2";
var db;
try{db=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){db=null}
if(!db){db={projects:[{id:"p1",name:"Meine Baustelle"}],projectId:"p1",entries:[],materials:["Zement","Beton","Schrauben","Dübel","Holz","Kabel"],tools:["Bohrhammer","Akkuschrauber","Winkelschleifer","Schaufel"]};save();}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]})}
function uid(){return "x"+Date.now()+Math.random().toString(36).slice(2)}
function mins(a,b){var x=a.split(":"),y=b.split(":");var m1=+x[0]*60 + +x[1],m2=+y[0]*60 + +y[1];if(m2<m1)m2+=1440;return m2-m1}
function fmt(m){m=Math.max(0,Math.round(m));return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+" h"}
function workMins(){return Math.max(0,mins($("start").value,$("end").value)-mins("00:00",$("breakTime").value))}
function calc(){ $("calc").textContent=fmt(workMins()) }
function renderProjects(){
 var a=$("projectSelect"),b=$("overviewProject");
 a.innerHTML=db.projects.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>'}).join("");
 b.innerHTML=a.innerHTML;
 a.value=db.projectId;b.value=window.ovProject||db.projectId;
}
function render(){
 renderProjects();
 var es=db.entries.filter(function(e){return e.projectId===db.projectId});
 var total=es.reduce(function(n,e){return n+e.minutes},0);
 $("totalHours").textContent=fmt(total);$("entryCount").textContent=es.length+" "+(es.length===1?"Tag":"Tage");
 $("recent").innerHTML=es.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).slice(0,5).map(function(e){
   return '<div class="item"><b>'+esc(e.date)+'</b> · '+fmt(e.minutes)+'<div class="muted">'+(e.materials.length?e.materials.map(function(m){return esc(m.qty)+" "+esc(m.unit)+" "+esc(m.name)}).join(", "):"Kein Material")+"</div></div>";
 }).join("")||'<div class="muted" style="padding:12px 0">Noch keine Einträge.</div>';
 renderOverview();renderMaster();
}
function renderOverview(){
 var pid=window.ovProject||db.projectId,es=db.entries.filter(function(e){return e.projectId===pid}).sort(function(a,b){return b.date.localeCompare(a.date)});
 $("ovHours").textContent=fmt(es.reduce(function(n,e){return n+e.minutes},0));$("ovDays").textContent=es.length;
 $("days").innerHTML=es.map(function(e){return '<div class="item"><b>'+esc(e.date)+'</b> · '+esc(e.start)+'–'+esc(e.end)+' · Pause '+esc(e.break)+'<br><b>'+fmt(e.minutes)+'</b>'+(e.note?'<div class="muted">'+esc(e.note)+'</div>':"")+"</div>"}).join("")||'<div class="muted">Noch keine Einträge.</div>';
 var mm={};es.forEach(function(e){e.materials.forEach(function(m){var k=m.name+"|"+m.unit;mm[k]=(mm[k]||0)+m.qty})});
 $("materialSummary").innerHTML=Object.keys(mm).map(function(k){var x=k.split("|");return '<div class="item"><b>'+esc(mm[k])+" "+esc(x[1])+"</b> "+esc(x[0])+"</div>"}).join("")||'<div class="muted">Noch kein Material.</div>';
 var tt={};es.forEach(function(e){e.tools.forEach(function(t){tt[t]=(tt[t]||0)+1})});
 $("toolSummary").innerHTML=Object.keys(tt).map(function(k){return '<div class="item"><b>'+esc(k)+'</b> · '+tt[k]+' '+(tt[k]===1?"Tag":"Tage")+"</div>"}).join("")||'<div class="muted">Noch kein Werkzeug.</div>';
}
function renderMaster(){$("materialMaster").value=db.materials.join(", ");$("toolMaster").value=db.tools.join(", ")}
function show(id){
 ["home","entry","overview","settings"].forEach(function(x){$(x).classList.toggle("hidden",x!==id)});
 ["navHome","navEntry","navOverview","navSettings"].forEach(function(x){$(x).classList.remove("active")});
 $("nav"+id.charAt(0).toUpperCase()+id.slice(1)).classList.add("active");
 if(id==="overview")renderOverview();
}
function addProject(){
 var n=prompt("Name der Baustelle:");
 if(n&&n.trim()){var p={id:uid(),name:n.trim()};db.projects.push(p);db.projectId=p.id;save();render()}
}
function addMaterial(){
 var d=document.createElement("div");d.className="row";
 d.innerHTML='<input class="matName grow" placeholder="Material"><input class="matQty" type="number" min="0" step="0.01" placeholder="Menge" style="max-width:90px"><input class="matUnit" placeholder="Einheit" style="max-width:78px"><button class="danger remove">×</button>';
 d.querySelector(".remove").onclick=function(){d.remove()};$("materials").appendChild(d);
}
function addTool(){
 var d=document.createElement("div");d.className="row";
 d.innerHTML='<input class="toolName grow" placeholder="Werkzeug"><button class="danger remove">×</button>';
 d.querySelector(".remove").onclick=function(){d.remove()};$("tools").appendChild(d);
}
function resetEntry(){
 var now=new Date(), local=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);
 $("date").value=local;$("start").value="07:00";$("end").value="15:00";$("breakTime").value="01:00";$("note").value="";$("materials").innerHTML="";$("tools").innerHTML="";calc()
}
function saveEntry(){
 var mats=[].slice.call(document.querySelectorAll("#materials .row")).map(function(r){return{name:r.querySelector(".matName").value.trim(),qty:Number(r.querySelector(".matQty").value)||0,unit:r.querySelector(".matUnit").value.trim()}}).filter(function(x){return x.name});
 var tools=[].slice.call(document.querySelectorAll("#tools .row")).map(function(r){return r.querySelector(".toolName").value.trim()}).filter(Boolean);
 db.entries.push({id:uid(),projectId:db.projectId,date:$("date").value,start:$("start").value,end:$("end").value,break:$("breakTime").value,minutes:workMins(),note:$("note").value.trim(),materials:mats,tools:tools});
 save();alert("Arbeitstag gespeichert.");resetEntry();render();show("home");
}
$("projectSelect").onchange=function(){db.projectId=this.value;save();render()};
$("overviewProject").onchange=function(){window.ovProject=this.value;renderOverview()};
$("addProjectBtn").onclick=addProject;$("newEntryBtn").onclick=function(){resetEntry();show("entry")};
$("addMaterialBtn").onclick=addMaterial;$("addToolBtn").onclick=addTool;$("saveEntryBtn").onclick=saveEntry;
$("start").oninput=calc;$("end").oninput=calc;$("breakTime").oninput=calc;
$("saveMasterBtn").onclick=function(){db.materials=$("materialMaster").value.split(",").map(function(x){return x.trim()}).filter(Boolean);db.tools=$("toolMaster").value.split(",").map(function(x){return x.trim()}).filter(Boolean);save();alert("Gespeichert.")};
$("navHome").onclick=function(){show("home")};$("navEntry").onclick=function(){resetEntry();show("entry")};$("navOverview").onclick=function(){show("overview")};$("navSettings").onclick=function(){show("settings")};
resetEntry();render();show("home");
})();
</script>
</body>
</html>
